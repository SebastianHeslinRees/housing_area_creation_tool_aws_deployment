version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: gunicorn --bind 0.0.0.0:8080 --workers 1 --timeout 300 app:server
  network:
    port: 8080
    env: PORT
  env:
    - name: PORT
      value: "8080"
    - name: AWS_REGION
      value: "eu-west-2"
    - name: HMA_PRECOMPUTED_S3_PREFIX
      value: "s3://dpa-population-projection-data/dpa-apps/housing_zones_precomputed"
    - name: HMA_DATASET_VERSION
      value: "2026-04-15"
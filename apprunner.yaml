version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.8
  # Use port 8022 for the updated fertility dashboard
  command: gunicorn --bind 0.0.0.0:8022 --workers 1 --timeout 120 app:server
  network:
    port: 8022
    env: PORT
  env:
    - name: PORT
      value: "8022"
    - name: DASHBOARD_PASSWORD
      value: "dashboardgla"